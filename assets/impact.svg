<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="Impact: over 500 million FCFA tracked monthly in a TMS, 195 employees on a self-service HRIS, manual tasks reduced from 90% to 10%, 6 iOS and Android apps delivered.">
<title>Impact: over 500 million FCFA tracked monthly in a TMS, 195 employees on a self-service HRIS, manual tasks reduced from 90% to 10%, 6 iOS and Android apps delivered.</title>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .in{opacity:1}
  }</style>
<rect x=".5" y=".5" width="899" height="159" rx="14" fill="#0d1117" stroke="#30363d"/>
<g class="in" style="animation-delay:0.15s"><rect x="16" y="16" width="208" height="128" rx="10" fill="#161b22" stroke="#30363d"/><text class="sans" x="34" y="72" font-size="36" font-weight="700" fill="#2dd4a7" letter-spacing="-.5">500M+</text><text class="sans" x="34" y="100" font-size="14" fill="#9da7b3">FCFA (~€760k) tracked</text><text class="sans" x="34" y="120" font-size="14" fill="#9da7b3">monthly in a TMS</text></g>
<g class="in" style="animation-delay:0.32999999999999996s"><rect x="236" y="16" width="208" height="128" rx="10" fill="#161b22" stroke="#30363d"/><text class="sans" x="254" y="72" font-size="36" font-weight="700" fill="#2dd4a7" letter-spacing="-.5">195</text><text class="sans" x="254" y="100" font-size="14" fill="#9da7b3">employees on a</text><text class="sans" x="254" y="120" font-size="14" fill="#9da7b3">self-service HRIS</text></g>
<g class="in" style="animation-delay:0.51s"><rect x="456" y="16" width="208" height="128" rx="10" fill="#161b22" stroke="#30363d"/><text class="sans" x="474" y="72" font-size="36" font-weight="700" fill="#2dd4a7" letter-spacing="-.5">90→10%</text><text class="sans" x="474" y="100" font-size="14" fill="#9da7b3">manual tasks on</text><text class="sans" x="474" y="120" font-size="14" fill="#9da7b3">transport operations</text></g>
<g class="in" style="animation-delay:0.6900000000000001s"><rect x="676" y="16" width="208" height="128" rx="10" fill="#161b22" stroke="#30363d"/><text class="sans" x="694" y="72" font-size="36" font-weight="700" fill="#2dd4a7" letter-spacing="-.5">6</text><text class="sans" x="694" y="100" font-size="14" fill="#9da7b3">iOS and Android</text><text class="sans" x="694" y="120" font-size="14" fill="#9da7b3">apps delivered</text></g>
</svg>
